databases:
  - name: wff-db
    databaseName: wff_signal_map
    user: wff
    plan: free

services:
  - type: web
    name: wff-signal-map
    runtime: node
    plan: free
    # migrate deploy + (first-run-only) seed must happen before `next build`
    # so the deployed instance has real chapters to render.
    buildCommand: npm ci && npm run render-build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wff-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.13.0
      # Optional — enables real AI assistant responses. Left unset here so
      # Render prompts for it instead of baking a key into the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
